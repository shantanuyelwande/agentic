version: '3.8'

services:
  # API Service - lightweight, stateless
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: claude-agent-api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - TASK_TTL_SECONDS=86400
      - PORT=8000
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - claude-network
    restart: unless-stopped

  # Worker Service - executes tasks from queue
  # Scale with: docker-compose up --scale worker=N
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - SKILLS_DIR=/app/.claude/skills
      - CHECKPOINT_INTERVAL=3
      - CLAUDE_MODEL=claude-sonnet-4-6
    depends_on:
      - redis
    networks:
      - claude-network
    restart: unless-stopped
    deploy:
      replicas: 2

  # Redis - task queue and state storage
  redis:
    image: redis:7-alpine
    container_name: claude-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - claude-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data:
    driver: local

networks:
  claude-network:
    driver: bridge
